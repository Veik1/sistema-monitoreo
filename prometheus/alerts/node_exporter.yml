groups:
  - name: node_exporter_alerts
    interval: 30s
    rules:
      # Alerta si el nodo está caído
      - alert: NodeDown
        expr: up{job="node_exporter"} == 0
        for: 2m
        labels:
          severity: critical
          component: node
        annotations:
          summary: "Nodo {{ $labels.instance }} está caído"
          description: "El node_exporter en {{ $labels.instance }} no responde por más de 2 minutos."

      # Alerta de CPU alta
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: cpu
        annotations:
          summary: "Uso alto de CPU en {{ $labels.instance }}"
          description: "CPU al {{ $value | humanize }}% durante más de 5 minutos."

      # Alerta de CPU crítica
      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          component: cpu
        annotations:
          summary: "Uso crítico de CPU en {{ $labels.instance }}"
          description: "CPU al {{ $value | humanize }}% durante más de 2 minutos."

      # Alerta de memoria alta
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: memory
        annotations:
          summary: "Uso alto de memoria en {{ $labels.instance }}"
          description: "Memoria al {{ $value | humanize }}% durante más de 5 minutos."

      # Alerta de memoria crítica
      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          component: memory
        annotations:
          summary: "Uso crítico de memoria en {{ $labels.instance }}"
          description: "Memoria al {{ $value | humanize }}% durante más de 2 minutos."

      # Alerta de disco lleno
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
          component: disk
        annotations:
          summary: "Espacio en disco bajo en {{ $labels.instance }}"
          description: "Partición {{ $labels.mountpoint }} tiene solo {{ $value | humanize }}% disponible."

      # Alerta de disco crítico
      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"}) * 100 < 10
        for: 2m
        labels:
          severity: critical
          component: disk
        annotations:
          summary: "Espacio en disco crítico en {{ $labels.instance }}"
          description: "Partición {{ $labels.mountpoint }} tiene solo {{ $value | humanize }}% disponible."

      # Alerta de carga del sistema alta
      - alert: HighSystemLoad
        expr: node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 0.8
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Carga del sistema alta en {{ $labels.instance }}"
          description: "Load average (15m) es {{ $value | humanize }} por CPU."

      # Alerta de predicción de disco lleno
      - alert: DiskWillFillIn4Hours
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"}[1h], 4 * 3600) < 0
        for: 5m
        labels:
          severity: warning
          component: disk
        annotations:
          summary: "Disco se llenará pronto en {{ $labels.instance }}"
          description: "Se estima que {{ $labels.mountpoint }} se llenará en 4 horas."
