groups:
  - name: container_alerts
    interval: 30s
    rules:
      # Alerta si un contenedor está caído
      - alert: ContainerDown
        expr: time() - container_last_seen{name!=""} > 60
        for: 2m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "Contenedor {{ $labels.name }} está caído"
          description: "El contenedor {{ $labels.name }} no se ha visto en más de 1 minuto."

      # Alerta de CPU alta en contenedor
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "Uso alto de CPU en contenedor {{ $labels.name }}"
          description: "Contenedor {{ $labels.name }} usando {{ $value | humanize }}% de CPU."

      # Alerta de memoria alta en contenedor
      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "Uso alto de memoria en contenedor {{ $labels.name }}"
          description: "Contenedor {{ $labels.name }} usando {{ $value | humanize }}% de memoria."

      # Alerta de reinicios frecuentes
      - alert: ContainerFrequentRestarts
        expr: rate(container_last_seen{name!=""}[1h]) > 5
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "Contenedor {{ $labels.name }} se reinicia frecuentemente"
          description: "Contenedor {{ $labels.name }} se ha reiniciado {{ $value }} veces en la última hora."
